name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "internal/sitegen/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Export documentation site
        env:
          OVERVIEW_DATA_DIR: ./site
          OVERVIEW_SITE_TITLE: Overview Docs
          OVERVIEW_EXPORT_DIR: _site
          OVERVIEW_EXPORT_BASE: /overview/
        run: go run ./cmd/overview export
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
