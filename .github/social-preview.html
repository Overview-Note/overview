<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; }
  body {
    font-family: "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fcfbf9;
    color: #2b2a27;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 72px 80px;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute; right: -160px; top: -160px; width: 620px; height: 620px;
    background: radial-gradient(circle, rgba(95,121,212,0.16), rgba(95,121,212,0) 70%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(#efeae2 1px, transparent 1px),
                      linear-gradient(90deg, #efeae2 1px, transparent 1px);
    background-size: 40px 40px;
    -webkit-mask-image: radial-gradient(circle at 75% 40%, #000 0%, transparent 62%);
            mask-image: radial-gradient(circle at 75% 40%, #000 0%, transparent 62%);
    opacity: .7;
  }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  .mark {
    width: 46px; height: 46px; border-radius: 13px;
    background: linear-gradient(145deg, #8ea1ea, #5f79d4); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px rgba(95,121,212,.35);
  }
  .mark svg { width: 62%; height: 62%; display: block; }
  .brand-name { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  h1 {
    font-size: 60px; line-height: 1.08; font-weight: 800; letter-spacing: -.03em;
    max-width: 900px;
  }
  h1 .accent { color: #5f79d4; }
  .sub {
    margin-top: 26px; font-size: 23px; color: #67635c; max-width: 900px; line-height: 1.5;
  }
  .chips { position: absolute; left: 80px; bottom: 70px; display: flex; gap: 12px; flex-wrap: wrap; }
  .chip {
    font-size: 16px; font-weight: 600; color: #5f79d4;
    background: #eef1fb; border: 1px solid #dde3f7; border-radius: 999px;
    padding: 8px 16px;
  }
  .tag {
    position: absolute; right: 80px; bottom: 74px;
    font-size: 17px; color: #908a81; font-family: ui-monospace, Consolas, monospace;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 4H6.5A2.5 2.5 0 0 0 4 6.5V9M15 4h2.5A2.5 2.5 0 0 1 20 6.5V9M20 15v2.5a2.5 2.5 0 0 1-2.5 2.5H15M9 20H6.5A2.5 2.5 0 0 1 4 17.5V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="2.15" fill="currentColor"/></svg></div>
    <div class="brand-name">Overview</div>
  </div>
  <h1>A Markdown knowledge base<br />you <span class="accent">fully own</span>.</h1>
  <div class="sub">
    Folder hierarchy &middot; files as the source of truth &middot; AI-native (MCP) &middot; WebDAV &middot; single binary.
  </div>
  <div class="chips">
    <span class="chip">Go</span>
    <span class="chip">Vue 3</span>
    <span class="chip">SQLite FTS5</span>
    <span class="chip">MCP</span>
    <span class="chip">WebDAV</span>
    <span class="chip">Docker</span>
  </div>
  <div class="tag">github.com/Overview-Note/overview</div>
</body>
</html>
